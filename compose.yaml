services:
  mcp-mockuuups:
    # Built from source on deploy: the repo push webhook redeploys, so no
    # registry image or second (Actions) webhook secret has to stay in sync.
    build: .
    pull_policy: build
    restart: unless-stopped
    init: true
    ports:
      # Bind to the host's tailnet IP, never 0.0.0.0: Docker publishes 0.0.0.0 past ufw,
      # so only the Hetzner firewall would stand in front of it. BIND_IP comes from the
      # Komodo stack environment (nebula-1: its tailnet IP). Unset = compose refuses to
      # render, so the running container is left alone. Do NOT use 127.0.0.1: cloudflared
      # (host network) reaches this port via the tailnet IP. See fleet-stacks SECURITY.md.
      - "${BIND_IP:?set BIND_IP (tailnet IP) in the stack environment}:8013:8000"
    environment:
      - TRANSPORT=http
      - HOST=0.0.0.0
      - MCP_API_KEY=${MCP_API_KEY:-}
      - MOCKUUUPS_API_KEY=${MOCKUUUPS_API_KEY:-}
      # Mockuuups' renderer fetches staged uploads back over the public
      # internet, so this must be the public origin, not a private address.
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      # Trial caps renders at 1000px. Raise once the plan has `hires`.
      - MOCKUUUPS_MAX_SIZE=${MOCKUUUPS_MAX_SIZE:-1000}
    # No volumes on purpose: staged uploads live in memory and are meant to
    # die with the process.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
