name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'tests/**'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6

      - name: Install and test
        run: |
          uv sync
          uv run pytest -x
        env:
          FASTMCP_MCP_CAMELCASE_COMPAT: "false"

      - name: Security audit (pip-audit)
        run: uvx pip-audit

      - name: Tag release
        id: version
        # Versions are git tags; nothing is committed or pushed to the branch
        # (protected). The tag push triggers no workflow: every workflow here
        # listens on branch pushes / PRs only. A re-run reuses HEAD's tag.
        run: |
          NEW=$(git tag --points-at HEAD --list 'v*' --sort=-v:refname | head -1)
          if [ -z "$NEW" ]; then
            LAST=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null \
              || echo "v$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)")
            IFS='.' read -r MAJOR MINOR PATCH <<< "${LAST#v}"
            NEW="v$MAJOR.$MINOR.$((PATCH + 1))"
            git tag "$NEW"
            git push origin "refs/tags/$NEW"
          fi
          echo "version=${NEW#v}" >> "$GITHUB_OUTPUT"
