[project]
name = "mcp-mockuuups"
version = "0.1.7"
description = "MCP server for Mockuuups Studio — search 5000+ device/print mockups and render screenshots or uploaded images into them"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Casey Romkes" }]
dependencies = [
    "fastmcp>=4.0.10,<5.0.0",
    "httpx>=0.28.1",
    "pydantic>=2.12",
    "pydantic-settings>=2.14.2",
    # Security floors (transitive deps of fastmcp; pinned to address CVEs)
    "authlib>=1.7.0",            # GHSA: CSRF in token cache handling
    "python-multipart>=0.0.32",  # GHSA: DoS via unbounded multipart headers
]

[project.urls]
Homepage = "https://github.com/CaseyRo/mcp-mockuuups"

[project.scripts]
mcp-mockuuups = "mcp_mockuuups.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_mockuuups"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.15.14",
]


[tool.ruff.lint]
# Pinned rather than inherited: ruff's default rule set widens between releases,
# so a dev-tools bump could turn a clean tree red (CDI-1783). Same set fleet-wide.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]
# UP042 (str+Enum -> StrEnum) changes str() of enum values, which can be persisted or on the wire: fleet decision is no.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
# Vendored verbatim from CDiT-infrastructure/scripts/mcp_usage_middleware.py; re-copy, never edit here.
# Its noqa directives (UP017, BLE001, S110) serve repos with other rule sets.
"src/mcp_mockuuups/usage.py" = ["RUF100", "UP017"]
